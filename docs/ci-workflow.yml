name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The suite needs a real PostgreSQL: the rule-engine golden master runs
    # without one, but the contract tests exercise the endpoints for real, and a
    # stub would only prove that the stub agrees with itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyplanner
          POSTGRES_PASSWORD: studyplanner
          POSTGRES_DB: studyplanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyplanner"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  end-to-end:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyplanner
          POSTGRES_PASSWORD: studyplanner
          POSTGRES_DB: studyplanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyplanner"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner

      # The report is what makes a failed flow diagnosable: it carries the trace
      # and the screenshot of the moment the assertion failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

# This file belongs at .github/workflows/ci.yml.
#
# It is parked here because the token this repository was pushed with does not
# carry GitHub's Workflows permission, and GitHub refuses any push that creates
# or edits a file under .github/workflows/ without it. Moving it into place is a
# one-line git mv from a checkout with ordinary credentials.

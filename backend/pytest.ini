[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# The application's connection pool is a module-level global bound to whichever
# event loop first created it, so fixtures and tests must share one loop for the
# whole session rather than getting a fresh loop each.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning:fastapi.*

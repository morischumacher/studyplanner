name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The suite needs a real PostgreSQL: the rule-engine golden master runs
    # without one, but the contract tests exercise the endpoints for real, and a
    # stub would only prove that the stub agrees with itself.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyplanner
          POSTGRES_PASSWORD: studyplanner
          POSTGRES_DB: studyplanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyplanner"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - name: Apply migrations and confirm the catalogue seeded
        working-directory: backend
        env:
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner
        # The boot migrator reports a failed migration and carries on, so an
        # unseeded catalogue would otherwise surface as a dozen puzzling test
        # failures rather than as one clear one.
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          from app.infrastructure.migrations import apply_pending, migrations_directory

          async def main():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              await apply_pending(connection, migrations_directory("sql"))
              courses = await connection.fetchval("SELECT count(*) FROM course")
              print(f"catalogue holds {courses} courses")
              assert courses > 0, "the catalogue did not seed"
              await connection.close()

          asyncio.run(main())
          PY

      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  end-to-end:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studyplanner
          POSTGRES_PASSWORD: studyplanner
          POSTGRES_DB: studyplanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyplanner"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Apply migrations and confirm the catalogue seeded
        working-directory: backend
        env:
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner
        # The boot migrator reports a failed migration and carries on, so an
        # unseeded catalogue would otherwise surface as a dozen puzzling test
        # failures rather than as one clear one.
        run: |
          python - <<'PY'
          import asyncio, os, asyncpg
          from app.infrastructure.migrations import apply_pending, migrations_directory

          async def main():
              connection = await asyncpg.connect(os.environ["DATABASE_URL"])
              await apply_pending(connection, migrations_directory("sql"))
              courses = await connection.fetchval("SELECT count(*) FROM course")
              print(f"catalogue holds {courses} courses")
              assert courses > 0, "the catalogue did not seed"
              await connection.close()

          asyncio.run(main())
          PY

      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: "true"
          DATABASE_URL: postgresql://studyplanner:studyplanner@localhost:5432/studyplanner

      # The report is what makes a failed flow diagnosable: it carries the trace
      # and the screenshot of the moment the assertion failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
